name: Optional external SciFact NLI audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install opt-in offline scientific NLI backend
        run: |
          python -m pip install -e '.[nli]'
      - name: Fetch only pinned public SciFact data and pinned model snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scifact"
          curl -fsSL --retry 2             https://scifact.s3-us-west-2.amazonaws.com/release/latest/data.tar.gz             -o "$RUNNER_TEMP/scifact/data.tar.gz"
          echo "11c621288d41ac144d29b13b0f8503b3820b7d6e8b1f6ff24dff335c196d76be  $RUNNER_TEMP/scifact/data.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/scifact/data.tar.gz" -C "$RUNNER_TEMP/scifact"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          folder = snapshot_download(
              "cross-encoder/nli-deberta-v3-small",
              revision="fa2804872c3b4bd748f38c0185cc85775361e735",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "nli-model"),
              allow_patterns=["*.json", "*.safetensors", "spm.model", "*.txt"],
          )
          print("Pinned model folder:", folder)
          PY
          echo "ebc79588dd73ccfb6a3f6078519cfbf512c5305384c5ea1845bc71cd32216e86  $RUNNER_TEMP/nli-model/model.safetensors" | sha256sum -c -
      - name: Independently re-evaluate oracle SciFact rationale labels without DEV tuning
        shell: bash
        env:
          LITERATURE_EVIDENCE_NLI_DEVICE: cpu
        run: |
          python -m scripts.evaluation.scifact_nli             --data "$RUNNER_TEMP/scifact/data"             --model-dir "$RUNNER_TEMP/nli-model"             --output "$RUNNER_TEMP/scifact_nli_cpu.json"
          python - <<'PY'
          import json, os
          d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"scifact_nli_cpu.json")))
          assert d["gold_dev_rationales"]==338
          assert d["model_safetensors_sha256"]=="ebc79588dd73ccfb6a3f6078519cfbf512c5305384c5ea1845bc71cd32216e86"
          assert d["no_independent_gold_for_insufficient_class"]
          print("Independent NLI audit counts and scientific caveats confirmed.")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scifact-oracle-rationale-nli-cpu-audit
          path: ${{ runner.temp }}/scifact_nli_cpu.json
          if-no-files-found: error
