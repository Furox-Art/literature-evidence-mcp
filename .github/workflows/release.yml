name: Release

# Publishes the version declared in pyproject.toml to PyPI through trusted
# publishing: the job exchanges this workflow's OIDC identity for a
# short-lived upload token, so no long-lived PYPI token secret exists.
# One-time pypi.org setup: project literature-evidence-mcp -> Publishing ->
# Trusted Publisher -> GitHub: owner Furox-Art, repository
# literature-evidence-mcp, workflow release.yml, environment pypi.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build + verify + publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify the artifacts match pyproject.toml
        run: |
          python - <<'PY'
          import email
          import pathlib
          import tomllib
          import zipfile

          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          sdists = list(pathlib.Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_path))
          assert metadata["Name"] == "literature-evidence-mcp", metadata["Name"]
          assert metadata["Version"] == expected, (metadata["Version"], expected)
          assert "literature_evidence_mcp/server.py" in zipfile.ZipFile(wheels[0]).namelist()
          print(f"Verified {metadata['Name']} {metadata['Version']} artifacts")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
