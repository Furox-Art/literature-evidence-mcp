name: Optional independent HealthVer three-way gold audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  healthver-three-class:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install opt-in NLI dependencies
        run: python -m pip install -e '.[nli]'
      - name: Download source-pinned annotated HealthVer CSVs without redistributing them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/healthver"
          rev=b20ac99ceed62f5264a319fa25a854df1668d85b
          for split in train dev test; do
            curl -fsSL --retry 2               "https://raw.githubusercontent.com/sarrouti/HealthVer/${rev}/data/healthver_${split}.csv"               -o "$RUNNER_TEMP/healthver/healthver_${split}.csv"
          done
          echo "57668949f79d0f46e66d74df4b0bc9812cad4d5ad7c5dd03dfba008a608b3f2a  $RUNNER_TEMP/healthver/healthver_train.csv" | sha256sum -c -
          echo "6f8ea31cbcf2ea5a2d3c82d65587d66e96de4f70e72642bbf7f61fec6ef8a93a  $RUNNER_TEMP/healthver/healthver_dev.csv" | sha256sum -c -
          echo "cf457d2dcddd7a736408082d0037527884f7ca3bda06729e1da5ec9e3b135819  $RUNNER_TEMP/healthver/healthver_test.csv" | sha256sum -c -
      - name: Download pinned offline NLI model files and verify weight fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download(
              "cross-encoder/nli-deberta-v3-small",
              revision="fa2804872c3b4bd748f38c0185cc85775361e735",
              local_dir=os.path.join(os.environ["RUNNER_TEMP"], "healthver-nli-model"),
              allow_patterns=["*.json", "*.safetensors", "spm.model", "*.txt"],
          )
          PY
          echo "ebc79588dd73ccfb6a3f6078519cfbf512c5305384c5ea1845bc71cd32216e86  $RUNNER_TEMP/healthver-nli-model/model.safetensors" | sha256sum -c -
      - name: Recompute held-out three-class health evidence metrics on CPU
        shell: bash
        env:
          LITERATURE_EVIDENCE_NLI_DEVICE: cpu
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: |
          python -m scripts.evaluation.healthver_nli \
            --data "$RUNNER_TEMP/healthver" \
            --model-dir "$RUNNER_TEMP/healthver-nli-model" \
            --output "$RUNNER_TEMP/healthver_audit.json"
          python - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"healthver_audit.json")))
          assert d["split"]["test_rows"]==1823
          assert d["split"]["unique_test_pairs"]==1694
          assert d["model_weights_sha256"]=="ebc79588dd73ccfb6a3f6078519cfbf512c5305384c5ea1845bc71cd32216e86"
          assert d["test_label_based_threshold_selection"] is False
          assert len(d["test_metrics_all_rows"]["per_class"])==3
          print("Three-class HealthVer held-out audit completed.")
          PY
      - name: Verify raw-neutral vs low-confidence decomposition against committed report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          actual = json.loads((Path(os.environ["RUNNER_TEMP"]) / "healthver_audit.json").read_text())
          expected = json.loads(Path("reports/evaluation/healthver_test.json").read_text())
          for key in ("source_sha256", "model_weights_sha256", "split",
                      "test_metrics_all_rows", "deduplicated_test_metrics",
                      "test_selective_metrics", "test_claim_cluster_bootstrap_95pct",
                      "exact_train_claim_overlap_excluded_sensitivity",
                      "topic_stratified_exploratory"):
              assert actual[key] == expected[key], f"Unexpected audited metric: {key}"
          actual_details = actual["neutral_and_abstention_diagnostics"]
          saved_details = expected["neutral_and_abstention_diagnostics"]
          for key in ("decision_origin", "argmax_three_class_metrics_without_abstention_mapping"):
              assert actual_details[key] == saved_details[key], f"Unexpected diagnostic: {key}"
          for key in ("brier_score_multiclass_uncalibrated",
                      "expected_calibration_error_10_bins_descriptive"):
              assert abs(actual_details[key] - saved_details[key]) < 0.0005, key
          assert sum(x["count"] for x in actual_details["decision_origin"].values()) == 1823
          print("Independent CPU diagnostic counts, score bins and gold report confirmed.")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: healthver-test-three-way-offline-cpu
          path: ${{ runner.temp }}/healthver_audit.json
          if-no-files-found: error
