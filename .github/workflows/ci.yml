name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev,retrieval]'
      - name: Test and enforce 100 percent statement and branch coverage
        run: pytest -q --cov=literature_evidence_mcp --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=100
      - name: Verify protocol test was not skipped
        run: pytest -q tests/test_mcp_protocol.py -rs
      - name: Lint v0.3 evidence audit and benchmark additions
        run: >-
          ruff check
          src/literature_evidence_mcp/methodology.py
          src/literature_evidence_mcp/source_audit.py
          src/literature_evidence_mcp/server.py
          src/literature_evidence_mcp/benchmark.py
          scripts/benchmark_roboto2.py
          scripts/compare_search_engines.py
          tests/test_methodology.py
          tests/test_source_audit.py
          tests/test_server_tools.py
          tests/test_benchmark.py
          tests/test_full_coverage_core.py
          tests/test_full_coverage_methodology.py
          tests/test_full_coverage_final.py
          tests/test_quote_token_integrity.py
          tests/test_metadata_disagreements.py
          tests/test_doi_identity_guard.py
          tests/test_native_adapters.py
          tests/test_advanced_review.py
          tests/test_prisma_flow.py
          tests/test_pdf_source.py
          tests/test_crossref_alerts.py
          tests/test_go_cache.py
          tests/test_cpp_random_wrapper.py
          tests/test_gold_evaluation_protocol.py
          tests/test_bm25_retrieval.py
          src/literature_evidence_mcp/bm25_retrieval.py
          scripts/evaluation/scifact_gold.py
          scripts/evaluation/evidencebench_gold.py
      - name: Check benchmark fixture tests
        run: pytest -q tests/test_methodology.py tests/test_source_audit.py tests/test_benchmark.py
      - name: Compile
        run: python -m compileall -q src
      - name: Build wheel and sdist
        run: python -m build

  npm-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/npm/package-lock.json
      - name: Install Python engine
        run: python -m pip install -e .
      - name: Install locked npm dependencies
        run: npm ci --prefix packages/npm --no-audit --no-fund
      - name: Test MCP bridge and require 100% TS coverage
        run: npm test --prefix packages/npm
        env:
          LITERATURE_EVIDENCE_PYTHON: python
      - name: Audit distributable npm package contents
        working-directory: packages/npm
        run: npm pack --dry-run --json

  native-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install core and native builder
        run: python -m pip install -e '.[dev]' maturin
      - name: Run Rust tests
        run: cargo test --manifest-path native/rust_text/Cargo.toml --no-default-features --locked
      - name: Install Rust line coverage collector
        run: cargo install cargo-llvm-cov --locked
      - name: Require 100 percent executable Rust lines
        run: cargo llvm-cov --manifest-path native/rust_text/Cargo.toml --no-default-features --lib --fail-under-lines 100
      - name: Build PyO3 extension wheel
        run: maturin build --manifest-path native/rust_text/Cargo.toml --release --out "$RUNNER_TEMP/rust-wheels"
      - name: Install wheel and verify real Python/Rust parity
        run: |
          python -m pip install "$RUNNER_TEMP"/rust-wheels/literature_evidence_rust-*.whl
          pytest -q native/tests/test_rust_real.py native/rust_text/tests/test_rust_python_parity.py

  native-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache-dependency-path: native/go_sources/go.mod
      - name: Install Python core and tests
        run: python -m pip install -e '.[dev]'
      - name: Go tests and race detection
        working-directory: native/go_sources
        run: go test -race -count=1 ./...
      - name: Require complete Go statement coverage including real CLI
        working-directory: native/go_sources
        run: |
          mkdir -p "$RUNNER_TEMP/go-unit" "$RUNNER_TEMP/go-cli" "$RUNNER_TEMP/go-all"
          go test -cover -args -test.gocoverdir="$RUNNER_TEMP/go-unit"
          go build -cover -o "$RUNNER_TEMP/go-probe" .
          printf '{invalid}' | GOCOVERDIR="$RUNNER_TEMP/go-cli" "$RUNNER_TEMP/go-probe" || true
          go tool covdata merge -i="$RUNNER_TEMP/go-unit,$RUNNER_TEMP/go-cli" -o="$RUNNER_TEMP/go-all"
          go tool covdata percent -i="$RUNNER_TEMP/go-all" | tee "$RUNNER_TEMP/go-coverage.txt"
          grep -q 'coverage: 100.0% of statements' "$RUNNER_TEMP/go-coverage.txt"
      - name: Real Go worker invoked by Python MCP tool
        run: pytest -q native/tests/test_go_real.py native/tests/test_go_records_real.py
        env:
          LITERATURE_EVIDENCE_GO_BIN: ${{ runner.temp }}/go-probe

  native-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python core, pybind11, numeric test tools
        run: python -m pip install -e '.[dev]' pybind11 gcovr
      - name: Compile C++17 extension with source coverage
        run: |
          cmake -S native/cpp_meta -B "$RUNNER_TEMP/cpp-build"             -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"             -DPython_EXECUTABLE="$(command -v python)"             -DCMAKE_CXX_FLAGS='-O0 -g --coverage'             -DCMAKE_SHARED_LINKER_FLAGS='--coverage'
          cmake --build "$RUNNER_TEMP/cpp-build" --parallel 4
      - name: Execute independent C++ known-value and integration tests
        run: pytest -q native/cpp_meta/tests native/tests/test_cpp_real.py native/tests/test_cpp_random_real.py
        env:
          PYTHONPATH: ${{ runner.temp }}/cpp-build
      - name: Require 100 percent executable C++ source lines
        run: |
          gcovr --root .             --filter 'native/cpp_meta/src/.*'             --exclude-noncode-lines --fail-under-line 100             "$RUNNER_TEMP/cpp-build" --txt


  native-portability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
          cache-dependency-path: native/go_sources/go.mod
      - name: Build and test Go
        run: go test ./...
        working-directory: native/go_sources
      - name: Check Rust compilation
        run: cargo check --manifest-path native/rust_text/Cargo.toml --locked
      - name: Install native build requirements
        run: python -m pip install pybind11
      - name: Build C++ extension on this OS
        shell: bash
        run: |
          cmake -S native/cpp_meta -B native/cpp_meta/build \
            -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" \
            -DPython_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')"
          cmake --build native/cpp_meta/build --config Release --parallel 2

  external-gold-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific core and pinned third-party retrieval baseline
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -r scripts/evaluation/requirements.txt
      - name: Download exact licensed public benchmark snapshots
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/science-gold"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 \
            https://scifact.s3-us-west-2.amazonaws.com/release/latest/data.tar.gz \
            -o "$RUNNER_TEMP/science-gold/scifact.tar.gz"
          echo "11c621288d41ac144d29b13b0f8503b3820b7d6e8b1f6ff24dff335c196d76be  $RUNNER_TEMP/science-gold/scifact.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/science-gold/scifact.tar.gz" -C "$RUNNER_TEMP/science-gold"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 \
            https://raw.githubusercontent.com/EvidenceBench/EvidenceBench/bf1d9633c694381c7b016fd56ee9f95f48593cc3/datasets/evidencebench_test_set.json \
            -o "$RUNNER_TEMP/science-gold/evidencebench_test.json"
          echo "771cc068e3e79764c2eb523e7d0d9fb276d00254a99212c73c1137674b49d18b  $RUNNER_TEMP/science-gold/evidencebench_test.json" | sha256sum -c -
      - name: Evaluate and require reproducible gold-labeled aggregate metrics
        shell: bash
        run: |
          python -m scripts.evaluation.scifact_gold \
            --data "$RUNNER_TEMP/science-gold/data" \
            --output "$RUNNER_TEMP/scifact_dev.json"
          python -m scripts.evaluation.evidencebench_gold \
            --data "$RUNNER_TEMP/science-gold/evidencebench_test.json" \
            --output "$RUNNER_TEMP/evidencebench_test.json"
          diff -u reports/evaluation/scifact_dev.json "$RUNNER_TEMP/scifact_dev.json"
          diff -u reports/evaluation/evidencebench_test.json "$RUNNER_TEMP/evidencebench_test.json"
          pytest -q tests/test_gold_evaluation_protocol.py
      - name: Measure open-corpus SciFact retrieval without semantic-label claims
        shell: bash
        run: |
          python -m scripts.evaluation.scifact_open_retrieval \
            --data "$RUNNER_TEMP/science-gold/data" \
            --output "$RUNNER_TEMP/scifact_open_retrieval.json"
          pytest -q tests/test_scifact_open_retrieval.py
          python -m scripts.evaluation.validate_bm25_integration --data "$RUNNER_TEMP/science-gold/data"
      - uses: actions/upload-artifact@v4
        with:
          name: scifact-full-corpus-retrieval
          path: ${{ runner.temp }}/scifact_open_retrieval.json
          if-no-files-found: error
