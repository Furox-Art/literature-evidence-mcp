name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Verify protocol test was not skipped
        run: pytest -q tests/test_mcp_protocol.py -rs
      - name: Lint v0.3 evidence audit and benchmark additions
        run: >-
          ruff check
          src/literature_evidence_mcp/methodology.py
          src/literature_evidence_mcp/server.py
          src/literature_evidence_mcp/benchmark.py
          scripts/benchmark_roboto2.py
          scripts/compare_search_engines.py
          tests/test_methodology.py
          tests/test_benchmark.py
      - name: Check benchmark fixture tests
        run: pytest -q tests/test_methodology.py tests/test_benchmark.py
      - name: Compile
        run: python -m compileall -q src
      - name: Build wheel and sdist
        run: python -m build
