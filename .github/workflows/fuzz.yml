name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/literature_evidence_mcp/**"
      - "tests/fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-literature-evidence-mcp
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Atheris
        run: python -m pip install atheris==3.1.0
      - name: Install literature-evidence-mcp
        run: python -m pip install -e .
      - name: Fuzz PRISMA screening validator
        run: python tests/fuzz/fuzz_prisma.py -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1
