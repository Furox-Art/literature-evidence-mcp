name: Bug report
description: A reproducible defect in the MCP server, adapters, native components, or documented behaviour
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Read CONTRIBUTING.md before filing. A useful report includes the
        expected behaviour, the observed behaviour, the exact provider response
        after redaction, and the smallest input that reproduces the problem.

        Do not paste API keys, credentials, confidential papers, or private
        paths. For a suspected vulnerability, use the private route in
        SECURITY.md instead of opening a public issue.

  - type: textarea
    id: expected-actual
    attributes:
      label: What happened, and what did you expect?
      description: Quote the exact output and name the documented behaviour it contradicts.
      placeholder: |
        `search_literature` returned no results for a DOI that resolves in
        Crossref. README.md says that provider errors are reported explicitly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest query, input file, or command sequence that shows the problem.
      placeholder: |
        1. Install with `python -m pip install -e '.[dev]'`
        2. Start the server with the transport and environment described below.
        3. Call `search_literature` with this query.
        4. Observe the reported status and output.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Exact output, errors, and exit code
      description: Include the provider response after redaction and the exit code, not only the final message.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version and install source
      description: Which version are you running, and how was it installed?
      placeholder: "0.5.0, editable install from a checkout"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface is affected?
      multiple: true
      options:
        - "Python MCP server (stdio)"
        - "Python MCP server (Streamable HTTP)"
        - "MCP tool called from a client"
        - "npm / Node.js adapter"
        - "Rust text matcher"
        - "Go provider-status component"
        - "C++ meta-analysis component"
        - "Evidence ledger or export"
        - "Install, build, or packaging"
        - "Documentation"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: providers
    attributes:
      label: Which external provider was involved?
      multiple: true
      options:
        - OpenAlex
        - Europe PMC
        - Crossref
        - Semantic Scholar
        - No external provider (offline or local input)
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and Node version if the adapter is involved.
      placeholder: "Windows 11, CPython 3.12, Node.js 22"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, related issues, or a proposed cause. Redact secrets and private data.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the open and closed issues for this problem.
          required: true
        - label: I read SECURITY.md and this is a defect, not a vulnerability.
          required: true
        - label: I removed API keys, credentials, confidential text, and private paths from what I pasted.
          required: true
        - label: I can reproduce this on the current version or on `main`.
          required: true
